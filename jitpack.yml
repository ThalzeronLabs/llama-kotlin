# JitPack build: https://jitpack.io/#ThalzeronLabs/llama-kotlin
#
# The library compiles llama.cpp (C++) for arm64-v8a and x86_64, so the build needs the
# Android NDK and CMake on top of the SDK. The script below installs exactly the versions
# pinned in llama/build.gradle.kts, reusing the SDK that JitPack provides when there is one.
jdk:
  - openjdk17

before_install:
  - git submodule update --init --recursive --depth 1
  - |
    set -e
    SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
    SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
    if [ ! -x "$SDKMANAGER" ]; then
      mkdir -p "$SDK/cmdline-tools"
      curl -sSLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
      unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
      rm -rf "$SDK/cmdline-tools/latest"
      mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
    fi
    yes | "$SDKMANAGER" --licenses > /dev/null || true
    "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;4.1.2" > /dev/null
    echo "sdk.dir=$SDK" > local.properties

install:
  - ./gradlew :llama:publishToMavenLocal -x test --no-daemon --stacktrace
