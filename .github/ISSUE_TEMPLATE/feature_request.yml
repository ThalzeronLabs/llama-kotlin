name: Feature request
description: Suggest an API or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, not the solution. "I want to stop generation when the model writes `###`" beats "add a stop parameter".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How you would like to call it from Kotlin.
      render: kotlin
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself (with guidance).
